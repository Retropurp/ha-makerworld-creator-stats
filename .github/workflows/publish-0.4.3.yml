name: Publish stable v0.4.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.4.3.yml"

permissions:
  contents: read

jobs:
  offline:
    name: Release / Offline regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python integration
        run: python -m compileall -q custom_components/makerworld_creator_stats
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  hassfest:
    name: Release / Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c

  hacs:
    name: Release / HACS Marketplace validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          comment: "false"

  publish:
    name: Publish v0.4.3 only after all checks pass
    needs: [offline, hassfest, hacs]
    if: github.repository == 'Retropurp/ha-makerworld-creator-stats' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify version, identity and release notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("custom_components/makerworld_creator_stats")
          manifest = json.loads((root / "manifest.json").read_text())
          const = (root / "const.py").read_text()
          api = (root / "api.py").read_text()
          assert manifest["version"] == "0.4.3", "Wrong manifest version"
          assert 'CLIENT_NAME = "ha-makerworld-creator-stats"' in const, "Wrong client identity"
          assert 'USER_AGENT = f"{CLIENT_NAME}/v{CLIENT_VERSION}"' in const, "User agent not versioned"
          assert '"User-Agent": USER_AGENT' in api and '"X-BBL-Client-Type": "homeautomation"' in api
          assert "OrcaSlicer" not in api and "bambu_network_agent" not in api
          assert Path("RELEASE_NOTES_0.4.3.md").exists(), "Missing release notes"
          PY
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.3 >/dev/null 2>&1; then
            echo "Release v0.4.3 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.4.3 \
            --target "$GITHUB_SHA" \
            --title "MakerWorld Creator Stats v0.4.3" \
            --notes-file RELEASE_NOTES_0.4.3.md \
            --latest
