name: Beta Python checks

on:
  push:
    branches:
      - "beta/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python integration
        run: python -m compileall -q custom_components/makerworld_creator_stats
      - name: Offline scheduling policy tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
